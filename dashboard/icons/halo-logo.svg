<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HALO">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
  </defs>
  <!-- the halo: an open ring, gap at the bottom-left where the swarm "lands" -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="138 26" transform="rotate(118 32 32)"/>
  <!-- quadcopter seen from above -->
  <g stroke="#eef3fb" stroke-width="3.2" stroke-linecap="round">
    <line x1="22.5" y1="22.5" x2="41.5" y2="41.5"/><line x1="41.5" y1="22.5" x2="22.5" y2="41.5"/>
  </g>
  <g fill="none" stroke="#eef3fb" stroke-width="2.4">
    <circle cx="21" cy="21" r="5"/><circle cx="43" cy="21" r="5"/><circle cx="21" cy="43" r="5"/><circle cx="43" cy="43" r="5"/>
  </g>
  <!-- locator: the person found -->
  <circle cx="32" cy="32" r="4.6" fill="#ff5a1f" stroke="#0b0f17" stroke-width="1.6"/>
</svg>
